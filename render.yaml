services:
  - type: web
    name: tracksyra-backend
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_HTTP_PORT
        value: "8080"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QUEUE_PREFIX
        value: tracksyra
      - key: CORS_ORIGIN
        sync: false
      - key: PASSWORD_RESET_REDIRECT_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: MEDIA_STORAGE_PROVIDER
        value: supabase
      - key: MEDIA_OUTPUT_BUCKET
        sync: false
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: FFPROBE_PATH
        value: ffprobe
