<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackSyra India - Music Distribution to Spotify, Apple Music & 150+ Platforms</title>
    <meta name="description" content="India's trusted music distribution platform. Release your songs on Spotify, JioSaavn, Apple Music, YouTube Music, Gaana & 150+ stores. Keep 90% royalties. Free signup for Indian artists, labels & publishers." />
    <meta name="author" content="TrackSyra" />
    <meta name="keywords" content="music distribution India, Spotify distribution India, Indian artist distribution, JioSaavn distribution, Bollywood music release, Punjabi music distribution, indie music India, upload music to Spotify India, music label India, royalty free distribution India, TrackSyra" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- Geo targeting India -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="language" content="English" />
    <meta name="distribution" content="global" />
    <meta name="rating" content="general" />

    <link rel="canonical" href="https://tracksyra.com/" />
    <link rel="alternate" hreflang="en-in" href="https://tracksyra.com/" />
    <link rel="alternate" hreflang="hi-in" href="https://tracksyra.com/" />
    <link rel="alternate" hreflang="x-default" href="https://tracksyra.com/" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="TrackSyra India - Music Distribution to Spotify, JioSaavn & 150+ Platforms" />
    <meta property="og:description" content="Release your music worldwide from India. 150+ streaming platforms including Spotify, Apple Music, JioSaavn & YouTube Music. Keep 90% of your royalties." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tracksyra.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="TrackSyra" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TrackSyra" />
    <meta name="twitter:title" content="TrackSyra India - Distribute Your Music Worldwide" />
    <meta name="twitter:description" content="India's trusted platform to release music on Spotify, JioSaavn, Apple Music & 150+ stores. 90% royalties." />
    <meta name="twitter:image" content="/favicon.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TrackSyra",
      "url": "https://tracksyra.com/",
      "logo": "https://tracksyra.com/favicon.png",
      "description": "Music distribution platform for Indian and global artists. Release music on Spotify, JioSaavn, Apple Music and 150+ streaming services.",
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "sameAs": [
        "https://twitter.com/TrackSyra"
      ]
    }
    </script>

    <!-- JSON-LD: Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Music Distribution",
      "provider": {
        "@type": "Organization",
        "name": "TrackSyra"
      },
      "areaServed": "India",
      "audience": {
        "@type": "Audience",
        "audienceType": "Musicians, Artists, Record Labels, Songwriters, Publishers"
      },
      "offers": {
        "@type": "Offer",
        "description": "Distribute music to 150+ platforms including Spotify, JioSaavn, Apple Music, YouTube Music. Keep 90% royalties."
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TrackSyra",
      "url": "https://tracksyra.com/",
      "inLanguage": "en-IN"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
